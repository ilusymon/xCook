services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: xcook-api:latest
    container_name: xcook
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:${APP_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
